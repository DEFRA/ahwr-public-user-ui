name: "CodeQL Advanced"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "33 3 * * 4"

permissions:
  contents: read

# Prevent multiple CodeQL scans for the same ref from running
# unnecessarily at the same time.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    runs-on:
      group: cdp-default
      labels:
        - stable

    timeout-minutes: 120

    # Explicit least-privilege permissions.
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:
          # Scan GitHub Actions workflows for security issues.
          - language: actions
            build-mode: none

          # Scan the Node.js / JavaScript / TypeScript application.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: DEFRA/cdp-build-action/checkout@stable
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          wait-for-processing: true