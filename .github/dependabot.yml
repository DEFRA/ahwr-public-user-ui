version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      dev:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      prod:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      security:
        applies-to: "security-updates"
        patterns:
          - "*"

      other:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    # Schedule run nightly
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"

    cooldown:
      default-days: 7

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

    ignore:
      # global-agent pinned to 3.x — v4 reworks the proxy API and breaks CDP forward-proxy setup
      - dependency-name: global-agent
        update-types:
          - version-update:semver-major
      # jsdom and global-jsdom pinned to major 26: the pair is version-coupled (global-jsdom 26 targets jsdom 26) and global-jsdom carries a patch-package patch tied to 26, so a major bump needs a coordinated migration plus patch regeneration (deferred)
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      - dependency-name: global-jsdom
        update-types:
          - version-update:semver-major
      # ioredis pinned to 5.x: @hapi/catbox-redis 7.0.2 peers ioredis ^5; revisit when catbox-redis accepts ^6
      - dependency-name: ioredis
        update-types:
          - version-update:semver-major
      # @hapi/catbox-memory pinned to 5.x: 6 trips a @hapi/validate error-annotation bug in the select-herd tests (public-ui only); revisit once @hapi/hapi ships a fixed @hapi/validate
      - dependency-name: "@hapi/catbox-memory"
        update-types:
          - version-update:semver-major

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run nightly
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"

    cooldown:
      default-days: 7
